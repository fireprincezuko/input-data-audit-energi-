<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Data Audit Ruangan</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1c2a29;--mute:#5d6e6c;--line:#cdd6d3;--acc:#0e6b5c;--warn:#b3402a}
@media (prefers-color-scheme:dark){:root{--bg:#141b1a;--card:#1d2726;--ink:#e6eeec;--mute:#93a5a2;--line:#33423f;--acc:#3fb6a0;--warn:#ff8a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 2px}
h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.wrap{max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
fieldset{border:1px solid var(--line);border-radius:4px;margin:0 0 12px;padding:10px 12px 12px}
legend{font-weight:600;padding:0 6px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:block;font-size:13px;color:var(--mute)}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;margin-top:3px;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-height:44px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{resize:vertical}
.ac{border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:4px;padding:10px;margin-bottom:12px}
.ac h3{margin:0 0 8px;font-size:15px}
.ac .hint{margin:10px 0 4px}
.pk{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(78px,1fr))}
.pk input{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;min-height:44px;padding:9px 14px;border-radius:4px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#07201b}}
button.ghost{background:transparent;color:var(--acc)}
button.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
button:hover{filter:brightness(1.1)}
.sp{flex:1}
.actions{position:sticky;bottom:0;background:var(--card);padding:10px 0 2px;margin-top:4px;border-top:1px solid var(--line);z-index:2}
.actions button[type=submit]{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:var(--bg);font-weight:600}
td.n,th.n{text-align:center}
.empty{padding:18px;color:var(--mute);text-align:center}
.mini{min-height:0;padding:3px 8px;font-size:12px}
.count{color:var(--mute);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px;color:var(--mute)}
.chk input{width:20px;height:20px;margin:0}
#fname{color:var(--mute);font-size:13px;margin:4px 0 0;word-break:break-all}
#cards{display:none}
.rc{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px;background:var(--bg)}
.rc h3{margin:0 0 2px;font-size:16px}
.rc .d{color:var(--mute);font-size:13px;margin-bottom:6px}
.rc dl{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:0 0 8px;font-size:13px}
.rc dt{color:var(--mute);font-size:12px}
.rc dd{margin:0 0 2px}
.rc .row button{flex:1;min-height:40px}
@media (max-width:700px){
 body{padding:10px}
 .card{padding:12px}
 .grid{grid-template-columns:1fr 1fr}
 .grid .full{grid-column:1/-1}
 .pk{grid-template-columns:repeat(4,1fr)}
 .tw{display:none}
 #cards{display:block}
 .row .sp{display:none}
 .row button{flex:1}
 fieldset{padding:8px 10px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Input data audit ruangan</h1>
  <p class="sub">Isi nama gedung, lalu isi satu ruangan per entri. Tekan Tambah ruangan, kemudian unduh CSV.</p>

  <div class="card">
    <label>Nama gedung (dipakai untuk nama file CSV)
      <input id="gedung" type="text" placeholder="contoh: Gedung A" autocomplete="off">
    </label>
    <div id="fname"></div>
  </div>

  <div class="card">
    <label>Lantai yang sedang diaudit (otomatis dipakai untuk ruangan yang ditambahkan)
      <select id="lantai"><option value="">- pilih -</option><option value="1">Lantai 1</option><option value="2">Lantai 2</option><option value="3">Lantai 3</option><option value="4">Lantai 4</option><option value="5">Lantai 5</option><option value="6">Lantai 6</option></select>
    </label>
  </div>

  <form id="f" class="card" autocomplete="off">
    <h2 id="mode">Ruangan baru</h2>
    <fieldset>
      <legend>Ruangan</legend>
      <div class="grid">
        <label class="full">Nama ruang<input name="nama" required></label>
        <label class="full">Dimensi ruang (P x L x T, m)<input name="dim" placeholder="4 x 5 x 3"></label>
        <label>Lux ruangan<input name="lux" type="number" step="any" inputmode="decimal"></label>
        <label>Suhu ruang (°C)<input name="suhu" type="number" step="any" inputmode="decimal"></label>
        <label>RH (%)<input name="rh" type="number" step="any" inputmode="decimal"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Lampu</legend>
      <div class="ac"><h3>Lampu 1</h3><div class="grid">
        <label class="full">Jenis lampu 1<select name="jl1" data-t="lampu"></select></label>
        <label>Daya lampu 1 (W)<input name="dl1" type="number" step="any" inputmode="decimal"></label>
        <label>Jumlah lampu 1<input name="jml1" type="number" min="0" step="1" inputmode="numeric"></label>
      </div></div>
      <div class="ac"><h3>Lampu 2</h3><div class="grid">
        <label class="full">Jenis lampu 2<select name="jl2" data-t="lampu"></select></label>
        <label>Daya lampu 2 (W)<input name="dl2" type="number" step="any" inputmode="decimal"></label>
        <label>Jumlah lampu 2<input name="jml2" type="number" min="0" step="1" inputmode="numeric"></label>
      </div></div>
    </fieldset>
    <fieldset>
      <legend>AC</legend>
      <div id="acs"></div>
      <div class="grid">
        <label>Suhu evap (°C)<input name="suhuevap" type="number" step="any" inputmode="decimal"></label>
        <label>Kecepatan evap<input name="kecevap" type="number" step="any" inputmode="decimal"></label>
        <label>Amper outdoor (A)<input name="ampout" type="number" step="any" inputmode="decimal"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Keterangan</legend>
      <label>Catatan tambahan<textarea name="ket" rows="3" placeholder="contoh: AC bocor, lampu sebagian mati"></textarea></label>
    </fieldset>
    <div class="row actions">
      <button type="submit" id="save">Tambah ruangan</button>
      <button type="button" class="ghost" id="cancel" hidden>Batal edit</button>
    </div>
  </form>

  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <h2 style="margin:0">Data tersimpan <span class="count" id="cnt"></span></h2>
      <span class="sp"></span>
      <button type="button" id="dl">Unduh / simpan CSV</button>
      <button type="button" class="ghost" id="cp">Salin CSV</button>
      <button type="button" class="danger" id="clr">Hapus semua</button>
    </div>
    <label class="chk"><input type="checkbox" id="sum"> Format sheet: gabungkan jumlah AC 1 dan AC 2 dalam satu set kolom PK</label>
    <div class="tw"><table id="tbl"></table></div>
    <div id="cards"></div>
    <div id="manual" hidden style="margin-top:12px"><label>Salin manual: tekan lama di kotak, pilih Pilih Semua lalu Salin, dan tempel di Notes atau Sheets.<textarea id="ta" readonly rows="8" style="width:100%;margin-top:4px;font:13px monospace;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)"></textarea></label></div>
  </div>
</div>


<script>
const PKS=["0.5","0.75","1","1.5","2","2.5","3","5"];
const KEY="audit-ruangan-v2",GKEY="audit-gedung-v1";
const pkCols=n=>PKS.map(p=>["a"+n+"pk"+p,"AC "+n+" - "+p+" PK"]);
const COLS=[
 ["nama","Nama Ruang"],["lantai","Lantai"],["dim","Dimensi Ruang"],
 ["jl1","Jenis Lampu 1"],["jl2","Jenis Lampu 2"],
 ["dl1","Daya Lampu 1"],["dl2","Daya Lampu 2"],
 ["jml1","Jumlah Lampu 1"],["jml2","Jumlah Lampu 2"],
 ["lux","Lux Ruangan"],
 ["ja1","Jenis AC 1"],["ja2","Jenis AC 2"],
 ["sp1","Setpoint AC 1"],["sp2","Setpoint AC 2"],
 ...pkCols(1),...pkCols(2),
 ["suhu","Suhu Ruang"],["rh","RH (%)"],
 ["suhuevap","Suhu Evap"],["kecevap","Kecepatan Evap"],["ampout","Amper Outdoor"],
 ["ket","Keterangan"]
];
const f=document.getElementById("f"),tbl=document.getElementById("tbl"),ged=document.getElementById("gedung");
let rows=[],editing=-1,prevLantai=null;
const lan=document.getElementById("lantai"),LKEY="audit-lantai-v1";
const FORMCOLS=COLS.filter(c=>c[0]!=="lantai");
try{rows=JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(localStorage.getItem("audit-ruangan-v1")||"[]")}catch(e){rows=[]}
// data lama: jumlah PK dianggap milik AC 1
rows.forEach(r=>PKS.forEach(p=>{if(r["pk"+p]!==undefined){if(r["a1pk"+p]===undefined)r["a1pk"+p]=r["pk"+p];delete r["pk"+p]}}));
try{ged.value=localStorage.getItem(GKEY)||"";lan.value=localStorage.getItem(LKEY)||""}catch(e){}
lan.addEventListener("change",()=>{try{localStorage.setItem(LKEY,lan.value)}catch(e){}});

document.getElementById("acs").innerHTML=[1,2].map(n=>`
 <div class="ac"><h3>AC ${n}</h3>
  <div class="grid"><label>Jenis AC ${n}<select name="ja${n}" data-t="ac"></select></label><label>Setpoint AC ${n} (°C)<input name="sp${n}" type="number" step="any" inputmode="decimal"></label></div>
  <label class="hint">Jumlah unit AC ${n} menurut besaran PK</label>
  <div class="pk">${PKS.map(p=>`<label>${p} PK<input name="a${n}pk${p}" type="number" min="0" step="1" inputmode="numeric"></label>`).join("")}</div>
 </div>`).join("");

const PRESET={lampu:["LED Bulb","LED Downlight","LED","TL","CFL","Pijar","Halogen"],ac:["Split","Split Inverter","Cassette","Standing","Window","VRV/VRF"]};
const SEL={lampu:["jl1","jl2"],ac:["ja1","ja2"]};
const extra={lampu:[],ac:[]};
function fillSelects(){
 Object.keys(SEL).forEach(t=>{
  const used=[];
  SEL[t].forEach(k=>rows.forEach(r=>{const v=String(r[k]||"").trim();if(v)used.push(v)}));
  const list=[...new Set([...PRESET[t],...used,...extra[t]])];
  SEL[t].forEach(k=>{
   const el=f.elements[k],cur=el.value;
   el.innerHTML='<option value="">- pilih -</option>'+list.map(v=>`<option>${esc(v)}</option>`).join("")+'<option value="__other">Lainnya (ketik sendiri)…</option>';
   el.value=list.includes(cur)?cur:"";
  });
 });
}
f.addEventListener("change",e=>{
 const el=e.target;
 if(el.tagName!=="SELECT"||el.value!=="__other")return;
 const t=el.dataset.t;
 const v=(prompt("Ketik jenis "+(t==="ac"?"AC":"lampu")+":")||"").trim();
 if(v){extra[t].push(v);fillSelects();el.value=v}else el.value="";
});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function fileName(){
 const g=ged.value.trim().replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g,"-");
 return "audit-"+(g?g+"-":"")+new Date().toISOString().slice(0,10)+".csv";
}
function showName(){document.getElementById("fname").textContent="Nama file: "+fileName()}
ged.addEventListener("input",()=>{try{localStorage.setItem(GKEY,ged.value)}catch(e){}showName()});

function renderCards(){
 const el=document.getElementById("cards");
 if(!rows.length){el.innerHTML='<div class="empty">Belum ada data. Isi form di atas lalu tekan Tambah ruangan.</div>';return}
 el.innerHTML=rows.map((r,i)=>{
  const items=COLS.filter(c=>c[0]!=="nama"&&c[0]!=="dim"&&String(r[c[0]]??"")!=="").map(c=>`<div><dt>${esc(c[1])}</dt><dd>${esc(r[c[0]])}</dd></div>`).join("");
  return `<div class="rc"><h3>${i+1}. ${esc(r.nama)}</h3><div class="d">${esc(r.dim||"")}</div><dl>${items}</dl><div class="row"><button class="ghost" data-e="${i}">Edit</button><button class="danger" data-d="${i}">Hapus</button></div></div>`}).join("");
}
function render(){
 fillSelects();renderCards();showName();
 document.getElementById("cnt").textContent=rows.length?`(${rows.length} ruangan)`:"";
 if(!rows.length){tbl.innerHTML='<tr><td class="empty">Belum ada data. Isi form di atas lalu tekan Tambah ruangan.</td></tr>';return}
 tbl.innerHTML="<thead><tr><th class='n'>No</th>"+COLS.map(c=>`<th>${esc(c[1])}</th>`).join("")+"<th></th></tr></thead><tbody>"+
  rows.map((r,i)=>`<tr><td class="n">${i+1}</td>`+COLS.map(c=>`<td>${esc(r[c[0]]??"")}</td>`).join("")+
  `<td><button class="mini ghost" data-e="${i}">Edit</button> <button class="mini danger" data-d="${i}">Hapus</button></td></tr>`).join("")+"</tbody>";
}

function setMode(i){
 editing=i;
 if(i<0&&prevLantai!==null){lan.value=prevLantai;prevLantai=null}
 document.getElementById("mode").textContent=i<0?"Ruangan baru":`Edit ruangan no. ${i+1}`;
 document.getElementById("save").textContent=i<0?"Tambah ruangan":"Simpan perubahan";
 document.getElementById("cancel").hidden=i<0;
}

f.addEventListener("submit",e=>{
 e.preventDefault();
 const r={};
 FORMCOLS.forEach(([k])=>{const v=(f.elements[k].value||"").trim();r[k]=v==="__other"?"":v});
 r.lantai=lan.value;
 if(editing<0)rows.push(r);else rows[editing]=r;
 persist();render();f.reset();setMode(-1);f.elements.nama.focus();
});
document.getElementById("cancel").onclick=()=>{f.reset();setMode(-1)};

document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e!==undefined){
  const i=+b.dataset.e;
  FORMCOLS.forEach(([k])=>{f.elements[k].value=rows[i][k]??""});
  if(editing<0)prevLantai=lan.value;
  lan.value=rows[i].lantai??"";
  setMode(i);f.scrollIntoView({behavior:"smooth"});f.elements.nama.focus();
 }else if(b.dataset.d!==undefined){
  const i=+b.dataset.d;
  if(confirm(`Hapus ruangan no. ${i+1} (${rows[i].nama})?`)){
   rows.splice(i,1);persist();render();
   if(editing===i){f.reset();setMode(-1)}else if(editing>i)setMode(editing-1);
  }
 }
});
document.getElementById("clr").onclick=()=>{
 if(rows.length&&confirm("Hapus semua data? Unduh CSV dulu jika perlu.")){rows=[];persist();render();f.reset();setMode(-1)}
};

function q(v){v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCsv(){
 const merge=document.getElementById("sum").checked;
 const base=COLS.filter(c=>!/^a\dpk/.test(c[0]));
 const cols=[];
 base.forEach(c=>{
  cols.push([c[1],r=>r[c[0]]]);
  if(c[0]==="sp2"){
   if(merge)PKS.forEach(p=>cols.push([p+" PK",r=>{
    const a=r["a1pk"+p],b=r["a2pk"+p];
    return(a===""||a===undefined)&&(b===""||b===undefined)?"":(+a||0)+(+b||0);
   }]));
   else pkCols(1).concat(pkCols(2)).forEach(c2=>cols.push([c2[1],r=>r[c2[0]]]));
  }
 });
 const head=["No",...cols.map(c=>c[0])].map(q).join(",");
 const body=rows.map((r,i)=>[i+1,...cols.map(c=>c[1](r))].map(q).join(","));
 return [head,...body].join("\r\n");
}
function showManual(csv){
 const m=document.getElementById("manual"),ta=document.getElementById("ta");
 m.hidden=false;ta.value=csv;ta.focus();ta.select();m.scrollIntoView({behavior:"smooth"});
}
document.getElementById("dl").onclick=async()=>{
 if(!rows.length){alert("Belum ada data untuk diunduh.");return}
 const csv=buildCsv(),name=fileName();
 try{
  const file=new File(["\ufeff"+csv],name,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
 }catch(err){if(err&&err.name==="AbortError")return}
 try{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
 }catch(err){}
 setTimeout(()=>{if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))showManual(csv)},600);
};
document.getElementById("cp").onclick=async()=>{
 if(!rows.length){alert("Belum ada data untuk disalin.");return}
 const csv=buildCsv();
 try{await navigator.clipboard.writeText(csv);alert("CSV tersalin. Tempel di Notes atau Google Sheets.")}
 catch(err){showManual(csv)}
};

render();
</script>
</body>
</html>
